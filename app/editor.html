<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目结果编辑器</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      --accent: #245f8f;
      --accent-soft: #e7f1f8;
      --border: #d4d8dc;
      --muted: #66717b;
      --surface-soft: #f6f7f7;
      --warning: #a34200;
      --success: #176b38;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: #222; background: #f4f4f2; }
    header { padding: 14px 20px; background: #20252b; color: white; }
    header small { color: #bbc2ca; }
    nav { display: flex; gap: 6px; padding: 10px 20px; background: white; border-bottom: 1px solid #ccc; }
    button, select, input, textarea { font: inherit; }
    button { padding: 7px 12px; cursor: pointer; font-size: 14px; }
    button:disabled, select:disabled, textarea:disabled { cursor: not-allowed; opacity: .62; }
    nav button.active { background: var(--accent); color: white; border-color: var(--accent); }
    main { padding: 14px 20px; }
    .layout { display: grid; grid-template-columns: minmax(380px, 44%) minmax(0, 1fr); gap: 14px; }
    .panel { background: white; border: 1px solid var(--border); padding: 12px; min-width: 0; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .toolbar input, .toolbar select { padding: 7px 8px; min-width: 140px; font-size: 14px; }
    .toolbar input { flex: 1; }
    .toolbar select { max-width: 100%; }
    .toolbar .inline { display: inline-flex; align-items: center; gap: 4px; margin: 0; font-weight: 400; }
    .term-toolbar { display: grid; gap: 9px; margin-bottom: 10px; }
    .term-primary { display: flex; align-items: center; gap: 8px; }
    .term-primary input { flex: 1; min-width: 0; }
    .term-secondary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px 14px;
    }
    .term-filters, .term-stats { display: flex; align-items: center; gap: 12px; }
    .term-filters { flex-wrap: wrap; }
    .term-stats { justify-content: flex-end; white-space: nowrap; }
    .term-filter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font-weight: 400;
      text-align: left;
      white-space: nowrap;
    }
    .term-filter input { margin: 0; }
    .list { height: calc(100vh - 210px); overflow: auto; border: 1px solid #ddd; }
    .list-empty { padding: 16px 12px; color: var(--muted); text-align: center; }
    .row {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid #e6e8ea;
      background: white;
      padding: 9px 10px 10px;
    }
    .row:hover { background: #f5f8fa; }
    .row.active { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
    .row-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
    .row-status {
      margin-left: auto;
      border: 1px solid #cdd3d8;
      border-radius: 999px;
      padding: 1px 7px;
      background: white;
      color: #47535d;
      white-space: nowrap;
    }
    .row-status.success { border-color: #afd4bd; background: #eef8f1; }
    .row-status.warning { border-color: #e0b184; background: #fff5e9; }
    .row-status.danger { border-color: #dfaaaa; background: #fff0f0; }
    .row-applied { color: var(--success); font-weight: 600; white-space: nowrap; }
    .preview-line { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 5px; margin-top: 3px; line-height: 1.45; }
    .preview-label { color: var(--muted); font-size: 12px; padding-top: 1px; }
    .preview-text {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .preview-text.missing { color: #8a9299; font-style: italic; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; }
    textarea { width: 100%; min-height: 110px; padding: 8px; resize: vertical; }
    input[type="text"] { width: 100%; padding: 7px; }
    .source { white-space: pre-wrap; padding: 9px; background: var(--surface-soft); border: 1px solid #ddd; min-height: 55px; overflow-wrap: anywhere; }
    .muted { color: var(--muted); }
    .warning { color: var(--warning); font-weight: 600; }
    .success { color: var(--success); }
    .conflict-box { margin: 8px 0; padding: 8px; border-left: 3px solid #c46a00; background: #fff6e8; }
    .choices { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .choices button { padding: 4px 8px; }
    .danger { color: #8b1d1d; }
    #message { min-height: 24px; margin: 8px 0; }
    .hidden { display: none !important; }
    .term-form { max-width: 760px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .compare-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }
    .compare-pane { min-width: 0; }
    .compare-pane label { margin-top: 0; }
    .compare-pane textarea { min-height: 150px; }
    .field-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
    .field-heading label { margin: 0; }
    .field-heading select { padding: 5px 7px; font-size: 14px; }
    .inline-note { min-height: 22px; margin-top: 5px; font-size: 13px; }
    #review-outdated { margin-top: 8px; }
    #review-applied-state { margin-top: 5px; font-size: 13px; }
    .context-card {
      margin-top: 10px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
    }
    .context-card summary {
      padding: 8px 9px;
      cursor: pointer;
      color: #46515a;
      font-size: 13px;
      font-weight: 600;
    }
    .context-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1px;
      border-top: 1px solid var(--border);
      background: var(--border);
    }
    .context-group { min-width: 0; height: 100%; background: white; }
    .context-heading {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      border-bottom: 1px solid #e6e8ea;
      color: #46515a;
      font-size: 13px;
      font-weight: 600;
    }
    .context-entry { padding: 7px 9px 8px; }
    .context-entry + .context-entry { border-top: 1px solid #e6e8ea; }
    .context-meta { color: var(--muted); font-size: 12px; margin-bottom: 3px; }
    .context-entry .preview-text {
      display: block;
      overflow: visible;
      -webkit-line-clamp: unset;
    }
    .context-empty { padding: 9px; color: var(--muted); font-size: 13px; }
    @media (max-width: 780px) {
      .layout { grid-template-columns: 1fr; }
      main { padding: 10px; }
      .list { height: 320px; }
      .compare-grid { grid-template-columns: 1fr; }
    }
    @media (min-width: 781px) and (max-width: 900px), (max-width: 520px) {
      .term-secondary { grid-template-columns: 1fr; }
      .term-stats { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <strong id="project-name">项目结果编辑器</strong><br>
    <small id="project-path"></small>
  </header>
  <nav>
    <button data-tab="terms">术语</button>
    <button data-tab="translation" class="active">翻译</button>
    <button data-tab="proofreading">校对</button>
    <button data-tab="polishing">润色</button>
  </nav>
  <main>
    <div id="message"></div>
    <section id="terms-view" class="hidden layout">
      <div class="panel">
        <div class="term-toolbar">
          <div class="term-primary">
            <input id="term-search" placeholder="筛选术语">
            <button id="new-term">新增</button>
          </div>
          <div class="term-secondary">
            <div class="term-filters">
              <label class="term-filter"><input id="only-conflicts" type="checkbox">只看冲突</label>
              <label class="term-filter"><input id="show-disabled" type="checkbox">显示已移除</label>
            </div>
            <div class="term-stats">
              <span id="term-revision" class="muted"></span>
              <span id="conflict-count" class="warning"></span>
            </div>
          </div>
        </div>
        <div id="term-list" class="list"></div>
      </div>
      <div class="panel term-form">
        <label>原文 source</label>
        <input id="term-source" type="text">
        <label>推荐译名</label>
        <input id="term-preferred" type="text">
        <div id="preferred-conflict" class="conflict-box hidden">
          <strong>推荐译名冲突</strong>
          <div id="preferred-choices" class="choices"></div>
        </div>
        <label>类别</label>
        <input id="term-category" type="text">
        <div id="category-conflict" class="conflict-box hidden">
          <strong>类别冲突</strong>
          <div id="category-choices" class="choices"></div>
        </div>
        <label>说明</label>
        <textarea id="term-description"></textarea>
        <label>别名（每行一个）</label>
        <textarea id="term-aliases"></textarea>
        <div class="actions">
          <button id="save-term">保存术语</button>
          <button id="remove-term" class="danger hidden">移除术语</button>
          <button id="restore-term" class="hidden">恢复术语</button>
        </div>
      </div>
    </section>
    <section id="stage-view" class="layout">
      <div class="panel">
        <div class="toolbar">
          <select id="file-filter"></select>
          <select id="status-filter" aria-label="状态筛选"></select>
          <input id="segment-search" placeholder="筛选当前阶段文本">
        </div>
        <div id="segment-list" class="list"></div>
        <div class="actions">
          <button id="previous">上一条</button>
          <button id="next">下一条</button>
        </div>
      </div>
      <div class="panel">
        <div id="segment-meta" class="muted">请选择 Segment</div>
        <details id="context-card" class="context-card">
          <summary id="context-summary">邻近上下文</summary>
          <div id="context-list" class="context-list"></div>
        </details>
        <label>原文</label>
        <div id="source" class="source"></div>
        <div id="translation-form">
          <label>译文</label>
          <textarea id="translation-text"></textarea>
          <div id="translation-validation" class="warning"></div>
          <div class="actions"><button id="save-translation">保存译文</button></div>
        </div>
        <div id="review-form" class="hidden">
          <div id="review-outdated" class="warning"></div>
          <div class="compare-grid">
            <section class="compare-pane">
              <label>当前基准</label>
              <div id="review-base" class="source"></div>
            </section>
            <section class="compare-pane">
              <div class="field-heading">
                <label for="suggested-text">建议文本</label>
                <select id="review-status" aria-label="建议状态">
                  <option value="suggested">建议修改</option>
                  <option value="accepted">接受基准</option>
                </select>
              </div>
              <textarea id="suggested-text"></textarea>
              <div id="review-accepted-note" class="inline-note muted hidden">接受基准时不会保存建议文本。</div>
            </section>
          </div>
          <label for="review-reason">原因</label>
          <textarea id="review-reason"></textarea>
          <label>最近 applied</label>
          <div id="review-applied" class="source muted"></div>
          <div id="review-applied-state" class="muted"></div>
          <div class="actions">
            <button id="save-review">保存建议</button>
            <button id="apply-review">保存并应用</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const state = {
      tab: "translation", project: null, detail: null, terms: [],
      selectedSegment: null, selectedTerm: null, selectedTermData: null
    };
    const STATUS_OPTIONS = {
      translation: [
        ["", "全部状态"],
        ["missing", "未翻译"],
        ["warning", "校验警告"],
        ["completed", "已翻译"]
      ],
      review: [
        ["", "全部状态"],
        ["missing_base", "缺少基准"],
        ["pending", "待审校"],
        ["suggested", "建议修改"],
        ["accepted", "接受基准"],
        ["outdated", "基准已变"],
        ["applied", "当前建议已应用"],
        ["unapplied", "当前建议未应用"]
      ]
    };
    const $ = id => document.getElementById(id);

    async function api(path, options = {}) {
      const response = await fetch(path, {
        headers: {"Content-Type": "application/json"},
        ...options
      });
      const value = await response.json();
      if (!response.ok) throw new Error(value.error || "请求失败");
      return value;
    }
    function message(text, error = false) {
      $("message").textContent = text;
      $("message").className = error ? "warning" : "success";
    }
    function reviewFor(item, stage = state.tab) {
      return item.reviews?.[stage] ?? {
        base: null, suggestion: null, applied: null,
        outdated: false, applied_current: false
      };
    }
    function searchText(item) {
      const values = [item.segment_id, item.source, item.translation?.text];
      if (state.tab !== "translation") {
        const review = reviewFor(item);
        values.push(
          review.base?.text,
          review.suggestion?.suggested_text,
          review.suggestion?.reason,
          review.applied?.text
        );
      }
      return values.filter(Boolean).join("\n").toLocaleLowerCase();
    }
    function currentSegments() {
      if (!state.project) return [];
      const file = $("file-filter").value;
      const status = $("status-filter").value;
      const query = $("segment-search").value.toLocaleLowerCase();
      return state.project.segments.filter(item =>
        (!file || item.file_id === file) &&
        matchesStatus(item, status) &&
        (!query || searchText(item).includes(query))
      );
    }
    function addPreview(button, label, text, fallback) {
      const line = document.createElement("div");
      line.className = "preview-line";
      const marker = document.createElement("span");
      marker.className = "preview-label";
      marker.textContent = label;
      const preview = document.createElement("span");
      preview.className = "preview-text" + (text ? "" : " missing");
      preview.textContent = text || fallback;
      line.append(marker, preview);
      button.appendChild(line);
    }
    function translationStatus(item) {
      if (!item.translation) return ["missing", "未翻译", "danger"];
      if (item.translation.validation_status === "warning") {
        return ["warning", "校验警告", "warning"];
      }
      return ["completed", "已翻译", "success"];
    }
    function reviewStatus(review) {
      if (!review.base) return ["missing_base", "缺少基准", "danger"];
      if (review.outdated) return ["outdated", "基准已变", "warning"];
      if (!review.suggestion) return ["pending", "待审校", ""];
      if (review.suggestion.review_status === "accepted") {
        return ["accepted", "接受基准", "success"];
      }
      return ["suggested", "建议修改", "warning"];
    }
    function matchesStatus(item, status) {
      if (!status) return true;
      if (state.tab === "translation") {
        return translationStatus(item)[0] === status;
      }
      const review = reviewFor(item);
      if (status === "applied") {
        return Boolean(review.suggestion && review.applied_current);
      }
      if (status === "unapplied") {
        return Boolean(review.suggestion && !review.applied_current);
      }
      return reviewStatus(review)[0] === status;
    }
    function renderStatusFilter() {
      const options = state.tab === "translation"
        ? STATUS_OPTIONS.translation
        : STATUS_OPTIONS.review;
      $("status-filter").innerHTML = "";
      for (const [value, label] of options) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = label;
        $("status-filter").appendChild(option);
      }
    }
    function renderSegments() {
      const items = currentSegments();
      $("segment-list").innerHTML = "";
      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "list-empty";
        empty.textContent = "没有符合当前筛选条件的 Segment";
        $("segment-list").appendChild(empty);
        return;
      }
      for (const item of items) {
        const button = document.createElement("button");
        button.className = "row" + (item.segment_id === state.selectedSegment ? " active" : "");
        const meta = document.createElement("div");
        meta.className = "row-meta";
        const identity = document.createElement("span");
        identity.textContent = `${item.segment_id} · 行 ${Number(item.line_index) + 1}`;
        meta.appendChild(identity);
        const review = state.tab === "translation" ? null : reviewFor(item);
        if (review?.applied_current) {
          const applied = document.createElement("span");
          applied.className = "row-applied";
          applied.textContent = "已应用";
          meta.appendChild(applied);
        }
        const [, statusText, statusClass] = state.tab === "translation"
          ? translationStatus(item)
          : reviewStatus(review);
        const status = document.createElement("span");
        status.className = `row-status ${statusClass}`.trim();
        status.textContent = statusText;
        meta.appendChild(status);
        button.appendChild(meta);
        if (state.tab === "translation") {
          addPreview(button, "原", item.source, "无原文");
          addPreview(button, "译", item.translation?.text, "尚无译文");
        } else {
          addPreview(button, "基", review.base?.text, "缺少基准");
          const suggestion = review.suggestion;
          const suggestionText = suggestion?.review_status === "accepted"
            ? "保留当前基准"
            : suggestion?.suggested_text;
          addPreview(button, "建", suggestionText, "尚无建议");
        }
        button.setAttribute(
          "aria-label",
          `${item.segment_id}，${statusText}，${item.source}`
        );
        button.onclick = () => selectSegment(item.segment_id);
        $("segment-list").appendChild(button);
      }
    }
    async function selectSegment(id) {
      state.selectedSegment = id;
      state.detail = await api(`/api/segment?id=${encodeURIComponent(id)}`);
      renderSegments();
      renderDetail();
    }
    function addContextGroup(label, items, emptyText) {
      const group = document.createElement("section");
      group.className = "context-group";
      const heading = document.createElement("div");
      heading.className = "context-heading";
      const title = document.createElement("span");
      title.textContent = label;
      const count = document.createElement("span");
      count.className = "muted";
      count.textContent = `${items.length} 条`;
      heading.append(title, count);
      group.appendChild(heading);
      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "context-empty";
        empty.textContent = emptyText;
        group.appendChild(empty);
      }
      for (const item of items) {
        const entry = document.createElement("div");
        entry.className = "context-entry";
        const meta = document.createElement("div");
        meta.className = "context-meta";
        meta.textContent = `行 ${Number(item.line_index) + 1}`;
        entry.appendChild(meta);
        addPreview(entry, "原", item.source, "无原文");
        if (state.tab === "translation") {
          addPreview(entry, "译", item.translation?.text, "尚无译文");
        } else {
          const base = reviewFor(item).base;
          addPreview(entry, "基", base?.text, "缺少基准");
        }
        group.appendChild(entry);
      }
      $("context-list").appendChild(group);
    }
    function renderContext() {
      $("context-list").innerHTML = "";
      if (!state.project || !state.detail) {
        $("context-summary").textContent = "邻近上下文";
        return;
      }
      const sameFile = state.project.segments.filter(
        item => item.file_id === state.detail.file_id
      );
      const index = sameFile.findIndex(
        item => item.segment_id === state.detail.segment_id
      );
      const before = index < 0 ? [] : sameFile.slice(Math.max(0, index - 2), index);
      const after = index < 0 ? [] : sameFile.slice(index + 1, index + 3);
      $("context-summary").textContent =
        `邻近上下文 · 上文 ${before.length} / 下文 ${after.length}`;
      addContextGroup("上文", before, "无更多上文");
      addContextGroup("下文", after, "无更多下文");
    }
    function renderDetail() {
      const detail = state.detail;
      if (!detail) return;
      $("segment-meta").textContent = `${detail.segment_id} · 行 ${Number(detail.line_index) + 1}`;
      renderContext();
      $("source").textContent = detail.source;
      const translating = state.tab === "translation";
      $("translation-form").classList.toggle("hidden", !translating);
      $("review-form").classList.toggle("hidden", translating);
      if (translating) {
        $("translation-text").value = detail.translation?.text ?? "";
        $("translation-validation").textContent =
          detail.translation?.validation_status === "warning" ? "当前译文有文字校验警告" : "";
      } else {
        const review = detail.reviews[state.tab];
        $("review-base").textContent = review.base?.text ?? "缺少基准";
        $("review-outdated").textContent = review.outdated
          ? "当前建议基于旧基准，请重新审校后再应用。"
          : review.base ? "" : "当前 Segment 缺少可用基准，无法保存建议。";
        $("review-status").value = review.suggestion?.review_status ?? "suggested";
        $("suggested-text").value = review.suggestion?.suggested_text ?? review.base?.text ?? "";
        $("review-reason").value = review.suggestion?.reason ?? "";
        $("review-applied").textContent = review.applied?.text ?? "尚未应用";
        $("review-applied-state").textContent = review.applied
          ? review.applied_current ? "当前建议已应用" : "最近应用结果来自较早建议"
          : "";
        $("review-applied-state").className = review.applied_current ? "success" : "muted";
        syncReviewControls();
      }
    }
    function syncReviewControls() {
      const review = state.detail?.reviews?.[state.tab];
      const hasBase = Boolean(review?.base);
      const accepted = $("review-status").value === "accepted";
      $("review-status").disabled = !hasBase;
      $("suggested-text").disabled = !hasBase || accepted;
      $("review-reason").disabled = !hasBase;
      $("save-review").disabled = !hasBase;
      $("apply-review").disabled = !hasBase;
      $("review-accepted-note").classList.toggle("hidden", !hasBase || !accepted);
    }
    function move(offset) {
      const items = currentSegments();
      const index = items.findIndex(item => item.segment_id === state.selectedSegment);
      const target = items[Math.max(0, Math.min(items.length - 1, index + offset))];
      if (target) selectSegment(target.segment_id);
    }
    async function saveTranslation() {
      if (!state.selectedSegment) return;
      const result = await api("/api/translation/save", {
        method: "POST",
        body: JSON.stringify({
          segment_id: state.selectedSegment, text: $("translation-text").value
        })
      });
      message(result.validation_status === "warning" ? "已保存（有校验警告）" : "译文已保存");
      await reloadProject();
      await selectSegment(state.selectedSegment);
    }
    async function saveReview(apply) {
      if (!state.selectedSegment || $("save-review").disabled) return;
      await api("/api/review/save", {
        method: "POST",
        body: JSON.stringify({
          stage: state.tab,
          segment_id: state.selectedSegment,
          review_status: $("review-status").value,
          suggested_text: $("suggested-text").value,
          reason: $("review-reason").value,
          apply
        })
      });
      message(apply ? "建议已保存并应用" : "建议已保存");
      await reloadProject();
      await selectSegment(state.selectedSegment);
    }
    async function loadTerms() {
      const value = await api("/api/terms");
      state.terms = value.terms;
      $("term-revision").textContent = `revision ${value.terms_revision ?? "无"}`;
      $("conflict-count").textContent = `待裁决 ${value.conflict_count}`;
      renderTerms();
    }
    function renderTerms() {
      const query = $("term-search").value.toLocaleLowerCase();
      const onlyConflicts = $("only-conflicts").checked;
      const showDisabled = $("show-disabled").checked;
      $("term-list").innerHTML = "";
      for (const term of state.terms.filter(item =>
        (!query || `${item.source} ${item.preferred_translation ?? ""}`.toLocaleLowerCase().includes(query)) &&
        (!onlyConflicts || item.has_conflicts) &&
        (showDisabled || !item.disabled)
      )) {
        const button = document.createElement("button");
        button.className = "row" + (term.normalized === state.selectedTerm ? " active" : "");
        const marker = term.disabled ? "×" : term.has_conflicts ? "⚠" : "·";
        button.textContent = `${marker} ${term.source} → ${term.preferred_translation ?? ""}`;
        button.onclick = () => selectTerm(term);
        $("term-list").appendChild(button);
      }
    }
    function renderChoices(containerId, values, targetId) {
      const container = $(containerId);
      container.innerHTML = "";
      for (const value of values) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = value;
        button.onclick = () => { $(targetId).value = value; };
        container.appendChild(button);
      }
    }
    function selectTerm(term) {
      state.selectedTerm = term?.normalized ?? null;
      state.selectedTermData = term;
      $("term-source").value = term?.source ?? "";
      $("term-preferred").value = term?.preferred_translation ?? "";
      $("term-category").value = term?.category ?? "";
      $("term-description").value = term?.description ?? "";
      $("term-aliases").value = (term?.aliases ?? []).join("\n");
      const categories = term?.conflicts?.categories ?? [];
      const translations = term?.conflicts?.preferred_translations ?? [];
      $("category-conflict").classList.toggle("hidden", categories.length === 0);
      $("preferred-conflict").classList.toggle("hidden", translations.length === 0);
      renderChoices("category-choices", categories, "term-category");
      renderChoices("preferred-choices", translations, "term-preferred");
      $("save-term").classList.toggle("hidden", Boolean(term?.disabled));
      $("remove-term").classList.toggle("hidden", !term || Boolean(term.disabled));
      $("restore-term").classList.toggle("hidden", !term?.disabled);
      renderTerms();
    }
    async function saveTerm(disabled = false) {
      await api("/api/terms/save", {
        method: "POST",
        body: JSON.stringify({
          old_normalized: state.selectedTerm,
          source: $("term-source").value,
          preferred_translation: $("term-preferred").value,
          category: $("term-category").value,
          description: $("term-description").value,
          aliases: $("term-aliases").value.split("\n").filter(Boolean),
          disabled
        })
      });
      message(disabled ? "术语已移除" : state.selectedTermData?.disabled ? "术语已恢复" : "术语已保存并发布为新 revision");
      state.selectedTerm = null;
      state.selectedTermData = null;
      selectTerm(null);
      await loadTerms();
    }
    async function reloadProject() {
      state.project = await api("/api/project");
      $("project-name").textContent = state.project.name + " · 项目结果编辑器";
      $("project-path").textContent = state.project.path;
      const previous = $("file-filter").value;
      $("file-filter").innerHTML = '<option value="">全部文件</option>';
      for (const file of state.project.files) {
        const option = document.createElement("option");
        option.value = file.file_id;
        option.textContent = `${file.file_id} · ${file.name}`;
        $("file-filter").appendChild(option);
      }
      $("file-filter").value = previous;
      renderSegments();
    }
    async function setTab(tab) {
      state.tab = tab;
      document.querySelectorAll("nav button").forEach(button =>
        button.classList.toggle("active", button.dataset.tab === tab)
      );
      $("terms-view").classList.toggle("hidden", tab !== "terms");
      $("stage-view").classList.toggle("hidden", tab === "terms");
      if (tab === "terms") await loadTerms();
      else {
        renderStatusFilter();
        renderSegments();
        renderDetail();
      }
    }
    function guard(action) {
      return async () => {
        try { await action(); }
        catch (error) { message(error.message, true); }
      };
    }
    document.querySelectorAll("nav button").forEach(button =>
      button.onclick = guard(() => setTab(button.dataset.tab))
    );
    $("file-filter").onchange = renderSegments;
    $("status-filter").onchange = renderSegments;
    $("segment-search").oninput = renderSegments;
    $("term-search").oninput = renderTerms;
    $("only-conflicts").onchange = renderTerms;
    $("show-disabled").onchange = renderTerms;
    $("previous").onclick = () => move(-1);
    $("next").onclick = () => move(1);
    $("save-translation").onclick = guard(saveTranslation);
    $("save-review").onclick = guard(() => saveReview(false));
    $("apply-review").onclick = guard(() => saveReview(true));
    $("review-status").onchange = syncReviewControls;
    $("new-term").onclick = () => selectTerm(null);
    $("save-term").onclick = guard(() => saveTerm(false));
    $("remove-term").onclick = guard(() => saveTerm(true));
    $("restore-term").onclick = guard(() => saveTerm(false));
    guard(async () => {
      $("context-card").open =
        !window.matchMedia("(max-width: 780px)").matches;
      renderStatusFilter();
      await reloadProject();
      const first = state.project.segments[0];
      if (first) await selectSegment(first.segment_id);
    })();
  </script>
</body>
</html>
