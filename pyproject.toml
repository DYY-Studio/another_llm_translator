[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-llm-translator"
version = "0.3.0"
description = "Local resumable LLM translation workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chardet>=5.2,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
minimal-llm-translator = "app.main:main"
minimal-llm-translator-editor = "app.editor:main"
minimal-llm-translator-web = "app.web:main"

[tool.setuptools]
packages = ["app", "app.web_dist", "app.web_dist.assets"]
include-package-data = true

[tool.setuptools.package-data]
app = ["web_dist/**"]

[tool.setuptools.data-files]
config = ["config/config.toml"]
prompts = [
  "prompts/polishing.middle.txt",
  "prompts/proofreading.middle.txt",
  "prompts/terminology.middle.txt",
  "prompts/translation.middle.txt",
]
llm_adapters = [
  "llm_adapters/anthropic.json",
  "llm_adapters/google-gemini.json",
  "llm_adapters/openai-compatible.json",
  "llm_adapters/openai-responses.json",
]
