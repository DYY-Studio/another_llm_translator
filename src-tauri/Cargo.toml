[package]
name = "minimal-llm-translator"
version = "0.3.0"
description = "Minimal LLM translator desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "minimal_llm_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[features]
custom-protocol = ["tauri/custom-protocol"]
