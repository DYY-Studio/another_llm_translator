[package]
name = "another-llm-translator"
version = "0.3.0"
description = "Another LLM Translator desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "another_llm_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
tauri-plugin-mcp-bridge = "0.12"

[features]
custom-protocol = ["tauri/custom-protocol"]
