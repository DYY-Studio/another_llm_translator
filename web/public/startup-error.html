<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>译工坊启动失败</title>
    <style>
      :root {
        color: #242424;
        background: #f5f6f8;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        box-sizing: border-box;
        margin: 0;
        min-height: 100vh;
        padding: 12vh 8vw;
      }

      main {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 860px;
        padding: 2rem 2.25rem;
        border: 1px solid #d9dce2;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 8px 24px rgb(28 35 48 / 8%);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }

      p {
        margin: 0 0 1rem;
      }

      pre {
        box-sizing: border-box;
        max-height: 50vh;
        margin: 0;
        overflow: auto;
        padding: 1rem;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border-radius: 8px;
        background: #f1f3f6;
        color: #3a2020;
        font: 0.875rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>译工坊无法启动</h1>
      <p>请根据下面的阶段、路径和原因修复配置或插件，然后重新启动应用。</p>
      <pre id="error">未提供启动错误详情。</pre>
    </main>
    <script>
      const message = new URLSearchParams(window.location.search).get("error");
      if (message) document.getElementById("error").textContent = message;
    </script>
  </body>
</html>
