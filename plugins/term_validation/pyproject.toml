[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "another-llm-translator-term-validation"
version = "0.1.0"
description = "Recommended terminology usage Validator for Another LLM Translator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "another-llm-translator>=0.3,<0.4",
]

[project.entry-points."another_llm_translator.plugins"]
term-validation = "another_llm_translator_term_validation.plugin:descriptor"

[tool.setuptools.packages.find]
where = ["src"]
