[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-llm-translator-srt"
version = "0.1.0"
description = "SRT Document Adapter for minimal-llm-translator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "minimal-llm-translator>=0.3,<0.4",
  "chardet>=5.2,<6",
]

[project.entry-points."minimal_llm_translator.plugins"]
srt = "minimal_llm_translator_srt.plugin:descriptor"

[tool.setuptools.packages.find]
where = ["src"]
